<!DOCTYPE html>
<html>
<head>
    <title>AT Transit Realtime</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://www.googletagmanager.com;">
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css"
        integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
        crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"
        integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og=="
        crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"
        integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spin.js/2.3.2/spin.min.js"></script>
    <script src="https://unpkg.com/leaflet-spin@1.1.0/leaflet.spin.min.js"></script>
    <script src="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.src.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.0.3/chroma.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/src/leaflet-search.css" />
    <style>
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; }
        #map { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
        #title {
            position: absolute;
            top: 10px;
            left: 0; right: 0; margin: auto;
            z-index: 1000; width: 500px;
            text-align: center; color: white; border-radius: 5px; padding: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            font-size: 1rem; font-family: Arial, Helvetica, sans-serif;
            text-shadow: 2px 2px #000000; font-weight: normal;
        }
        .info {
            background-color: white; padding: 15px; color: black;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); border-radius: 5px;
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-77710107-12"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);} 
        gtag('js', new Date());
        gtag('config', 'UA-77710107-12');
    </script>
</head>
<body>
    <h1 id="title">Welcome to the Auckland Transport Transit Realtime Map!</h1>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            center: [-36.8862, 174.7651],
            zoom: 12,
            worldCopyJump: true
        });

        var positron = L.tileLayer.provider('CartoDB.Positron').addTo(map);

        var baseMaps = {
            "OSM": L.tileLayer.provider("OpenStreetMap.Mapnik"),
            "OSM Grayscale": L.tileLayer.provider("OpenStreetMap.BlackAndWhite"),
            "CartoDB Positron": positron,
            "CartoDB Dark Matter": L.tileLayer.provider("CartoDB.DarkMatter"),
            "ESRI WorldImagery": L.tileLayer.provider("Esri.WorldImagery"),
            "Google Hybrid": L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            "Wikimedia": L.tileLayer.provider("Wikimedia")
        };

        map.attributionControl.addAttribution("© <a href='https://dev-portal.at.govt.nz/'>AT</a>");

        // Define custom icons for different transport modes
        var busIcon = L.icon({
            iconUrl: 'bus-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker bus-marker'
        });

        var airportlinkIcon = L.icon({
            iconUrl: 'airportlink-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker airportlink-marker'
        });

        var twentyfourR = L.icon({
            iconUrl: '24R-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 24R-marker'
        });

        var twentyfourB = L.icon({
            iconUrl: '24B-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 24B-marker'
        });

        var twentytwoR = L.icon({
            iconUrl: '22R-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 22R-marker'
        });

        var twentytwoN = L.icon({
            iconUrl: '22N-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 22N-marker'
        });

        var sixtyseven = L.icon({
            iconUrl: '67-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 67-marker'
        });

        var sixtyeight = L.icon({
            iconUrl: '68-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 68-marker'
        });

        var oneseventy = L.icon({
            iconUrl: '170-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 170-marker'
        });

        var seventy = L.icon({
            iconUrl: '70-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 70-marker'
        });

        var seventyH = L.icon({
            iconUrl: '70H-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 70H-marker'
        });

        var seventyfive = L.icon({
            iconUrl: '75-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 75-marker'
        });

        var sevenfiveone = L.icon({
            iconUrl: '751-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 751-marker'
        });

        var sevenfivefive = L.icon({
            iconUrl: '755-icon.png',
            iconSize: [48, 24],
            iconAnchor: [24, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker 755-marker'
        });

        // model-specific icons (images stored in repo root)
        var enviro200Icon = L.icon({
            iconUrl: 'Enviro200.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker enviro200-marker'
        });

        var enviro500 = L.icon({
            iconUrl: 'Enviro500.png',
            iconSize: [80, 48],
            iconAnchor: [40, 24],
            popupAnchor: [0, -16],
            className: 'transit-marker enviro500-marker'
        });

        var outE200Icon = L.icon({
            iconUrl: 'OuterLinkE200.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker OUTenviro200-marker'
        });

        var innE200Icon = L.icon({
            iconUrl: 'InnerLinkE200.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker INNenviro200-marker'
        });

        var scaniaKIcon = L.icon({
            iconUrl: 'ScaniaK270UB6.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker scania-marker'
        });
        
        var kbbTriAxleIcon = L.icon({
            iconUrl: 'KBBTXL.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker KBB-marker'
        });
        
        var manND323FIcon = L.icon({
            iconUrl: 'MANND323F.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker ND323F-marker'
        });
        
        var man162X0Icon = L.icon({
            iconUrl: 'MAN162X0GBV.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker MAN162X0-marker'
        });

        var man18290Icon = L.icon({
            iconUrl: 'MAN18290GBV.png',
            iconSize: [80, 24],
            iconAnchor: [40, 12],
            popupAnchor: [0, -16],
            className: 'transit-marker MAN18290-marker'
        });

        var atshoreIcon = L.icon({
            iconUrl: 'at-shore-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker atshore-marker'
        });

        var alexanderdennisIcon = L.icon({
            iconUrl: 'alexnaderdennis.png',
            iconSize: [48, 32],
            iconAnchor: [24, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker alexanderdennis-marker'
        });

        var trainIcon = L.icon({
            iconUrl: 'train-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker train-marker'
        });

        var easternLine = L.icon({
            iconUrl: 'easternL.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker easternLine-marker'
        });

        var onehungaLine = L.icon({
            iconUrl: 'onehungaL.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker onehungaLine-marker'
        });

        var southernLine = L.icon({
            iconUrl: 'southernL.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker southernLine-marker'
        });

        var westernLine = L.icon({
            iconUrl: 'westernL.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker westernLine-marker'
        });

        var ferryIcon = L.icon({
            iconUrl: 'ferry-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker ferry-marker'
        });

        var otherIcon = L.icon({
            iconUrl: 'unknown-icon.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16],
            className: 'transit-marker other-marker'
        });

        // Bus stop icon
        var stopIcon = L.icon({
            iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="%23FF6B6B" stroke="%23fff" stroke-width="2"/></svg>',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -10],
            className: 'stop-marker'
        });

        var layers = {
            2: L.layerGroup().addTo(map),
            3: L.layerGroup().addTo(map),
            4: L.layerGroup().addTo(map),
            null: L.layerGroup().addTo(map),
            stops: L.layerGroup().addTo(map)
        };

        var search = L.control.search({
            layer: L.layerGroup([layers[2], layers[3], layers[4], layers[null], layers.stops]),
            initial: false,
            propertyName: 'desc'
        });
        map.addControl(search);

        $(document).on("keyup", ".search-input", function () {
            var searchVal = this.value.toLowerCase();
            for (var i in markers) {
                if (!markers.hasOwnProperty(i)) continue;
                var marker = markers[i];
                if (!searchVal || (marker.options.desc && marker.options.desc.toLowerCase().includes(searchVal))) {
                    marker.setOpacity(1);
                } else {
                    marker.setOpacity(0);
                }
            }
            for (var j in stops) {
                if (!stops.hasOwnProperty(j)) continue;
                var stop = stops[j];
                if (!searchVal || (stop.options.desc && stop.options.desc.toLowerCase().includes(searchVal))) {
                    stop.setOpacity(1);
                } else {
                    stop.setOpacity(0);
                }
            }
        });

        var overlayMaps = {
            "AT Buses": layers[3],
            "AT Trains": layers[2],
            "AT Ferries": layers[4],
            "Out of Service": layers[null],
            "Bus Stops": layers.stops
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = 'Colour by: <select id="colourscheme"><option>Route</option><option>Occupancy</option><option>Speed</option></select><div id="status"></div>';
            return div;
        };
        legend.addTo(map);

        $(document).on("change", "#colourscheme", function () {
            window.colourscheme = this.value;
            location.hash = this.value;
            for (var i in markers) {
                if (!markers.hasOwnProperty(i)) continue;
                updateMarkerOpacity(markers[i]);
            }
        });

        window.colourscheme = "Route";
        if (location.hash) {
            window.colourscheme = location.hash.slice(1);
            $("#colourscheme").val(window.colourscheme);
        }

        function updateMarkerOpacity(marker) {
            var opacity = 1;
            if (window.colourscheme == "Route") {
                opacity = 1;
            } else if (window.colourscheme == "Occupancy" && marker.occupancy_status !== undefined) {
                opacity = Math.max(0.2, marker.occupancy_status / 6);
            } else if (window.colourscheme == "Speed") {
                opacity = Math.max(0.2, Math.min(1, marker.speed / 100));
            }
            marker.setOpacity(opacity);
        }

        // plates.json map (loaded at startup)
        var plateMap = {};
        var modelIconMap = {
            "Enviro200.png": enviro200Icon,
            "OuterE200.png": OUTE200Icon,
            "InnerE200.png": INNE200Icon,
            "ScaniaK270UB6.png": scaniaKIcon
        };

        function loadPlateMap() {
            return fetch('plates.json')
                .then(r => r.ok ? r.json() : {})
                .then(json => { plateMap = json || {}; })
                .catch(err => { console.warn('plates.json load failed', err); plateMap = {}; });
        }
        // start loading plates.json now
        loadPlateMap();

        function normalisePlateToken(s) {
            if (!s) return '';
            return s.toString().toUpperCase().replace(/[^A-Z0-9]/g,'');
        }
        function tokensFromString(s) {
            if (!s) return [];
            return s.toString().split(/[,\/%|;]+|\s+/).map(normalisePlateToken).filter(Boolean);
        }

        // Check vehicleInfo fields (license_plate, label, vehicle_id) for known plates
        function getPlateIcon(vehicleInfo) {
            if (!vehicleInfo) return null;
            var candidates = [vehicleInfo.license_plate, vehicleInfo.label, vehicleInfo.vehicle_id];
            for (var idx=0; idx<candidates.length; idx++) {
                var src = candidates[idx];
                if (!src) continue;
                var tokens = tokensFromString(src);
                for (var t of tokens) {
                    if (plateMap && plateMap[t]) {
                        var file = plateMap[t];
                        if (file && modelIconMap[file]) return modelIconMap[file];
                    }
                    // inline fallback for a couple of plates
                    if (t === 'HGL555') return enviro200Icon;
                    if (t === 'EJC617') return scaniaKIcon;
                }
            }
            return null;
        }

        function getIconForRouteType(routeType, routeId) {
            if (routeId && routeId.includes('AIR')) {
                return airportlinkIcon;
            }
            
            if (routeId && routeId.includes('24R')) {
                return twentyfourR;
            }

            if (routeId && routeId.includes('24B')) {
                return twentyfourB;
            }

            if (routeId && routeId.includes('22R')) {
                return twentytwoR;
            }

            if (routeId && routeId.includes('22N')) {
                return twentytwoN;
            }

            if (routeId && routeId.includes('67A')) {
                return sixtyseven;
            }

            if (routeId && routeId.includes('67B')) {
                return sixtyseven;
            }

            if (routeId && routeId.includes('68')) {
                return sixtyeight;
            }

            if (routeId && routeId.includes('170')) {
                return oneseventy;
            }

            if (routeId && routeId.includes('70')) {
                return seventy;
            }

            if (routeId && routeId.includes('70H')) {
                return seventyH;
            }

            if (routeId && routeId.includes('751')) {
                return sevenfiveone;
            }

            if (routeId && routeId.includes('755')) {
                return sevenfivefive;
            }

            if (routeId && routeId.includes('75')) {
                return seventyfive;
            }
            
            if (routeId && routeId.includes('WSTH')) {
                return ferryIcon;
            }
            
            if (routeId && routeId.includes('EAST')) {
                return easternLine;
            }

            if (routeId && routeId.includes('ONE')) {
                return onehungaLine;
            }

            if (routeId && routeId.includes('STH')) {
                return southernLine;
            }

            if (routeId && routeId.includes('WEST')) {
                return westernLine;
            }

            switch(routeType) {
                case 2: return trainIcon;
                case 3: return busIcon;
                case 4: return ferryIcon;
                default: return otherIcon;
            }
        }

        var markers = {};
        var stops = {};
        var busServices = {};
        var occupancy = ["empty", "many seats available", "few seats available", "standing room only", "limited standing room", "full", "not accepting passengers"];
        var occupancyColors = ["#4575b4", "#91bfdb", "#e0f3f8", "#fee090", "#fc8d59", "#d73027", "black"];
        var speedColors = chroma.scale([chroma.hsv(270, 1, 1), chroma.hsv(180, 1, 1), chroma.hsv(90, 1, 1), chroma.hsv(0, 1, 1)]).mode("hsv").domain([0, 100]);

        var hasLoaded = false;
        var routes = {};

        function safeId(input) {
            if (input === null || input === undefined) return "id";
            return String(input).replace(/[^a-zA-Z0-9_\-]/g, "_");
        }

        function bikeText(val) {
            if (val === null || val === undefined) return "Unknown";
            var n = parseInt(val, 10);
            if (isNaN(n)) return String(val);
            if (n === 1) return "Allowed";
            if (n === 2) return "Not allowed";
            return "Unknown";
        }

        function accessibilityText(val) {
            if (val === null || val === undefined) return "Unknown";
            var n = parseInt(val, 10);
            if (isNaN(n)) return String(val);
            if (n === 1) return "Accessible";
            if (n === 2) return "Not accessible";
            return "Unknown";
        }

        function loadBusServices() {
            fetch('bus_services.json')
                .then(response => response.json())
                .then(data => {
                    for (var service of data) {
                        busServices[service.RouteNumber] = service;
                    }
                    console.log("Loaded " + Object.keys(busServices).length + " bus services");
                })
                .catch(err => console.error("Error loading bus services:", err));
        }

        function loadBusStops() {
            fetch('https://api.at.govt.nz/gtfs/v3/stops?limit=5000', {
                method: 'GET',
                headers: {
                    'Cache-Control': 'no-cache',
                    'Ocp-Apim-Subscription-Key': '6cb37daf7f5c4feda39bbf640e892074',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.data && Array.isArray(data.data)) {
                    for (var stop of data.data) {
                        var stopId = stop.id;
                        var stopName = stop.attributes.stop_name;
                        var lat = stop.attributes.stop_lat;
                        var lng = stop.attributes.stop_lon;
                        var desc = "<b>" + stopName + "</b>";

                        if (lat && lng) {
                            var stopMarker = L.marker([lat, lng], { 
                                icon: stopIcon,
                                desc: desc,
                                opacity: 0.6
                            });
                            stopMarker.bindTooltip(desc);
                            stopMarker.addTo(layers.stops);
                            stops[stopId] = stopMarker;
                        }
                    }
                    console.log("Loaded " + Object.keys(stops).length + " bus stops");
                }
            })
            .catch(err => console.error("Error loading bus stops:", err));
        }

        map.spin(true);
        fetch('https://api.at.govt.nz/gtfs/v3/routes', {
            method: 'GET',
            headers: {
                'Cache-Control': 'no-cache',
                'Ocp-Apim-Subscription-Key': '6cb37daf7f5c4feda39bbf640e892074',
            }
        })
        .then(response => response.json())
        .then(response => {
            map.spin(false);
            if (response.message) {
                console.error(response);
                $("#status").text("Error getting routes: " + response.message);
            } else {
                for (var r of response.data) {
                    if (r.attributes.route_type == 712) r.attributes.route_type = 3;
                    routes[r.id] = r.attributes;
                }
            }
            loadBusServices();
            loadBusStops();
            loop();
        })
        .catch(err => {
            map.spin(false);
            console.error(err);
            $("#status").text("Error loading routes.");
        });

        function loop() {
            if (hasLoaded && !document.hasFocus()) {
                console.log("tab unfocused, skipping");
                return;
            }
            hasLoaded = true;

            map.spin(true);
            fetch('https://api.at.govt.nz/realtime/legacy/vehiclelocations', {
                method: 'GET',
                headers: {
                    'Cache-Control': 'no-cache',
                    'Ocp-Apim-Subscription-Key': '6cb37daf7f5c4feda39bbf640e892074',
                }
            })
            .then(response => response.json())
            .then(data => {
                map.spin(false);

                if (!data || !data.response || !Array.isArray(data.response.entity)) {
                    console.error("Unexpected vehiclelocations response", data);
                    $("#status").text("Unexpected vehicle data.");
                    return;
                }

                for (var i in data.response.entity) {
                    if (!data.response.entity.hasOwnProperty(i)) continue;
                    var ent = data.response.entity[i];
                    var id = ent.id;
                    var v = ent.vehicle;
                    if (!v) continue;

                    var vehicleInfo = v.vehicle || {};
                    var label = vehicleInfo.label || ("id " + id);
                    var desc = "<b>" + label + "</b><br>";
                    var layer = layers[null];
                    var marker = markers[id];
                    var routeType = null;

                    var sid = safeId(id);

                    if (marker) {
                        if (v.position && typeof v.position.latitude === "number" && typeof v.position.longitude === "number") {
                            marker.setLatLng([v.position.latitude, v.position.longitude]);
                        }
                        marker.options.desc = desc;
                    } else {
                        var icon = otherIcon;

                        // Try plate-based icon first
                        var plateIcon = getPlateIcon(vehicleInfo);
                        if (plateIcon) {
                            icon = plateIcon;
                        } else if (v.trip) {
                            var r = routes[v.trip.route_id];
                            if (r) {
                                routeType = r.route_type;
                                icon = getIconForRouteType(routeType, v.trip.route_id);
                            }
                        }

                        marker = L.marker([v.position.latitude || 0, v.position.longitude || 0], { 
                            icon: icon,
                            desc: desc,
                            opacity: 1
                        });
                        marker._entityId = id;
                        marker.route_type = routeType;
                        markers[id] = marker;

                        marker.on("tooltipopen", function (e) {
                            var target = e.target;
                            if (!target || !target.trip) return;
                            var tripId = target.trip.trip_id;
                            if (!tripId) return;

                            fetch('https://api.at.govt.nz/gtfs/v3/trips/' + tripId, {
                                method: 'GET',
                                headers: {
                                    'Cache-Control': 'no-cache',
                                    'Ocp-Apim-Subscription-Key': '6cb37daf7f5c4feda39bbf640e892074',
                                }
                            })
                            .then(resp => resp.json())
                            .then(respJson => {
                                if (respJson.message) {
                                    console.error(respJson.message);
                                    $("#status").text("Error getting trip: " + respJson.message);
                                } else if (respJson.data && respJson.data.attributes) {
                                    var attrs = respJson.data.attributes;
                                    var eid = safeId(target._entityId);
                                    $("#headsign-" + eid).text(attrs.trip_headsign || "");
                                    var bikeVal = attrs.bike_allowed ?? attrs.bikes_allowed ?? attrs.bikes_allowed;
                                    $("#bike_allowed-" + eid).text(bikeText(bikeVal));
                                    var accVal = attrs.wheelchair_accessible ?? attrs.accessibility ?? attrs.wheelchair_access;
                                    $("#accessibility-" + eid).text(accessibilityText(accVal));
                                }
                            })
                            .catch(err => console.error(err));
                        });
                    }

                    if (v.trip) {
                        var r = routes[v.trip.route_id];
                        marker.trip = v.trip;
                        if (r) {
                            desc += "Agency: " + r.agency_id + "<br>Route: " + r.route_long_name + "<br>Headsign: <div id='headsign-" + sid + "'></div>";
                            marker.options.desc = desc;
                            marker.route_long_name = r.route_long_name;
                            marker.route_type = r.route_type;
                            layer = layers[r.route_type] || layers[null];
                        } else {
                            layer = layers[null];
                        }
                    }

                    marker.addTo(layer);
                    marker.speed = Math.round((v.position && v.position.speed) ? v.position.speed : 0);

                    var bikeAllowed =
                        (v.bike_allowed ?? v.bikes_allowed) ??
                        (v.vehicle && (v.vehicle.bike_allowed ?? v.vehicle.bikes_allowed)) ??
                        (v.trip && (v.trip.bike_allowed ?? (v.trip.attributes && (v.trip.attributes.bike_allowed ?? v.trip.attributes.bikes_allowed))));

                    var accessibility =
                        (v.wheelchair_accessible ?? v.accessibility) ??
                        (v.vehicle && (v.vehicle.wheelchair_accessible ?? v.vehicle.accessibility)) ??
                        (v.trip && (v.trip.wheelchair_accessible ?? (v.trip.attributes && (v.trip.attributes.wheelchair_accessible ?? v.trip.attributes.accessibility ?? v.trip.attributes.wheelchair_access))));

                    marker.bikes_allowed = bikeAllowed;
                    marker.accessibility = accessibility;

                    // Attempt to show detected model name if plate matched
                    var plateIconUsed = getPlateIcon(vehicleInfo);
                    var modelName = '';
                    if (plateIconUsed === enviro200Icon) modelName = 'Enviro 200';
                    if (plateIconUsed === scaniaKIcon) modelName = 'Scania K270UB6';

                    var tooltipHtml = desc +
                        "Speed: " + marker.speed + " km/h<br>" +
                        "Occupancy: " + (occupancy[v.occupancy_status] || "") + "<br>" +
                        "License plate: " + (vehicleInfo.license_plate || "") + "<br>" +
                        (modelName ? ("Model: " + modelName + "<br>") : "") +
                        "Bike Enabled: <span id='bike_allowed-" + sid + "'>" + bikeText(marker.bikes_allowed) + "</span><br>" +
                        "Accessibility: <span id='accessibility-" + sid + "'>" + accessibilityText(marker.accessibility) + "</span>";
                    marker.bindTooltip(tooltipHtml);

                    marker.occupancy_status = v.occupancy_status;
                    updateMarkerOpacity(marker);
                }
            })
            .catch(err => {
                map.spin(false);
                console.error(err);
                $("#status").text("Error loading vehicle locations.");
            });
        }
        setInterval(loop, 10000);
    </script>
</body>
</html>
